apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: homework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-config-reader
  namespace: homework
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["backend-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-config-reader-binding
  namespace: homework
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: homework
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-config-reader

