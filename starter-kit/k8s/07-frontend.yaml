apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: homework
spec:
  selector:
    app: frontend

  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: homework

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
        network-role: app

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: frontend:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: frontend-config

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 150m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /healthz
              port: 8080

            periodSeconds: 3
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080

            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080

            periodSeconds: 10

